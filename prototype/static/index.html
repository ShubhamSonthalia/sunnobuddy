<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SunnoBuddy prototype</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>SunnoBuddy (prototype)</h1>
  <div class="meta">
    <div id="who">Not started</div>
    <div id="mode" class="small"></div>
  </div>
</header>

<main>
  <!-- Step 1: anonymous session -->
  <div id="start" class="notice">
    SunnoBuddy is a support tool, not a therapist. No email or personal details are needed.
    <div style="margin-top:8px"><button class="primary" id="startBtn">Continue anonymously</button></div>
  </div>

  <div id="app" style="display:none">
    <nav>
      <button data-tab="chat" class="active">Chat</button>
      <button data-tab="intake">Guided intake</button>
      <button data-tab="mindlog">MindLog</button>
    </nav>

    <!-- Chat -->
    <section id="tab-chat" class="active">
      <div id="chatNotice"></div>
      <div id="chatLog" class="log"></div>
      <div class="row">
        <input type="text" id="chatInput" placeholder="Type how you are feeling...">
        <button class="primary" id="chatSend">Send</button>
      </div>
    </section>

    <!-- Intake -->
    <section id="tab-intake">
      <div id="intakeProgressText" class="small"></div>
      <div class="bar"><div id="intakeBar" style="width:0%"></div></div>
      <div id="intakeSection" class="small"></div>
      <div id="intakeQuestion" style="font-size:16px; margin:8px 0"></div>
      <div id="intakeCrisis"></div>
      <textarea id="intakeAnswer" placeholder="Your answer. You can write 'skip' to skip a question."></textarea>
      <div style="margin-top:8px" class="row">
        <button class="primary" id="intakeSend">Submit answer</button>
        <button class="plain" id="intakeReset">Restart intake</button>
      </div>
    </section>

    <!-- MindLog -->
    <section id="tab-mindlog">
      <label>Title</label>
      <input type="text" id="mlTitle">
      <label>Date</label>
      <input type="date" id="mlDate">
      <label>What is on your mind?</label>
      <textarea id="mlContent"></textarea>
      <div style="margin-top:8px" class="row">
        <button class="primary" id="mlSave">Save entry</button>
        <button class="plain" id="mlRaw">Show how it is stored</button>
      </div>
      <div id="mlCrisis"></div>
      <div id="mlRawBox"></div>
      <h3>Your entries</h3>
      <div id="mlCounts" class="counts"></div>
      <div id="mlList"></div>
    </section>
  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
